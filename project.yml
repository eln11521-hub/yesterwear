name: YesterdayWeather
options:
  bundleIdPrefix: com.yesterdayweather
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  BASE_SDK: iphoneos
  SWIFT_VERSION: "5.0"
  TARGETED_DEVICE_FAMILY: "1,2"
targets:
  YesterdayWeather:
    type: application
    platform: iOS
    sources:
      - path: YesterdayWeather
      - path: Shared
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.yesterdayweather.app
      INFOPLIST_KEY_CFBundleDisplayName: Yesterday Weather
      INFOPLIST_KEY_LSRequiresIPhoneOS: YES
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
      INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: 需要位置以取得今日與昨日氣溫、體感對比。
      CODE_SIGN_ENTITLEMENTS: YesterdayWeather/YesterdayWeather.entitlements
      DEVELOPMENT_TEAM: ""
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: YesterdayWeatherWidget
    entitlements:
      path: YesterdayWeather/YesterdayWeather.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.yesterdayweather.shared
  YesterdayWeatherWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: YesterdayWeatherWidget
      - path: Shared
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.yesterdayweather.app.widget
      CODE_SIGN_ENTITLEMENTS: YesterdayWeatherWidget/YesterdayWeatherWidget.entitlements
      GENERATE_INFOPLIST_FILE: NO
      INFOPLIST_FILE: YesterdayWeatherWidget/Info.plist
      INFOPLIST_KEY_CFBundleDisplayName: Yesterday Weather
      LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    entitlements:
      path: YesterdayWeatherWidget/YesterdayWeatherWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.yesterdayweather.shared
schemes:
  YesterdayWeather:
    build:
      targets:
        YesterdayWeather: all
        YesterdayWeatherWidget: all
    run:
      config: Debug
